name: Build Bars APK
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies Safely
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libsqlite3-dev lzip standard-clzip zlib1g-dev libffi-dev libssl-dev autoconf libtool pkg-config

      - name: Install Build Environment
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade setuptools virtualenv wheel
          pip install cython==0.29.38
          pip install buildozer kivy==2.3.0

      - name: Build Android APK with Buildozer
        run: |
          yes | buildozer android debug
        env:
          BUILDOZER_WARN_ON_ROOT: 0

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Bars-Premium-APK
          path: bin/*.apk
